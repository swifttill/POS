# SwiftTill local development stack.
# Provides a local Postgres so the app runs with zero external accounts.
# Swap to Neon in production by setting DATABASE_URL in apps/web/.env.local.

services:
  postgres:
    image: postgres:16-alpine
    container_name: swifttill-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: swifttill
    ports:
      - "5432:5432"
    volumes:
      - swifttill_pg:/var/lib/postgresql/data

volumes:
  swifttill_pg:
