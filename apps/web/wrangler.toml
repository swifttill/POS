name = "swifttill"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# next-on-pages writes the Worker output here.
pages_build_output_dir = ".vercel/output"

# Non-secret runtime vars. Secrets (DATABASE_URL, CLOUDINARY_*) are set with:
#   npx wrangler pages secret put DATABASE_URL
[vars]
NEXT_PUBLIC_APP_NAME = "SwiftTill POS"
