name: Fix Cloudflare Prisma Lifecycle

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm run prisma:generate

      - name: Apply Cloudflare-safe DB lifecycle fix
        shell: bash
        run: |
          cat > apps/web/lib/db.ts <<'EOF'
          import { PrismaClient } from "@prisma/client";
          import { PrismaNeon } from "@prisma/adapter-neon";

          function createDbClient() {
            const connectionString = process.env.DATABASE_URL;

            if (!connectionString) {
              throw new Error("DATABASE_URL is not configured");
            }

            const adapter = new PrismaNeon({
              connectionString,
            });

            return new PrismaClient({
              adapter,
              log:
                process.env.NODE_ENV === "development"
                  ? ["error", "warn"]
                  : ["error"],
            });
          }

          /**
           * Cloudflare Workers reuse isolates across requests.
           * Never retain Prisma/Neon I/O state globally.
           *
           * Existing routes can continue importing `db`, but each Prisma
           * operation resolves against a fresh client created inside the
           * active request context.
           */
          export const db = new Proxy({} as PrismaClient, {
            get(_target, property) {
              const client = createDbClient();
              const value = Reflect.get(client, property, client);

              return typeof value === "function"
                ? value.bind(client)
                : value;
            },
          });
          EOF

      - name: Verify global Prisma cache is gone
        shell: bash
        run: |
          if grep -q "globalForPrisma" apps/web/lib/db.ts; then
            echo "ERROR: global Prisma cache still exists."
            exit 1
          fi

          if ! grep -q "createDbClient" apps/web/lib/db.ts; then
            echo "ERROR: request-safe DB factory was not written."
            exit 1
          fi

          echo "DB lifecycle source verification passed."

      - name: Build SwiftTill
        run: pnpm run build

      - name: Show final DB file
        run: cat apps/web/lib/db.ts

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add apps/web/lib/db.ts

          if git diff --cached --quiet; then
            echo "No DB lifecycle changes required."
          else
            git commit -m "Fix Cloudflare Prisma request lifecycle"
            git push
          fi
